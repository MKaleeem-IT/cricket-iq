<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket IQ — Predict Match</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-body">

    <nav class="navbar">
        <div class="nav-brand">🏏 Cricket IQ</div>
        <div class="nav-links">
            <a href="/dashboard.html">Dashboard</a>
            <a href="/predict.html" class="active">Predict</a>
            <a href="/upcoming.html">Upcoming</a>
            <a href="/stats.html">Stats</a>
            <a href="/about.html">About</a>
        </div>
        <div class="nav-user">
            <div class="avatar" id="user-avatar">?</div>
            <span id="welcome-text">Welcome</span>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </nav>

    <main class="main-content">

        <div class="page-header">
            <h1>🏆 Match Winner Prediction</h1>
            <p>Enter match details and get ML-based prediction.</p>
        </div>

        <div class="info-card" style="padding: 32px;">
            <div class="section-title" style="margin-top: 0;">⚔️ Select Teams</div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px;">
                <div>
                    <label style="display:block; font-size:13px; font-weight:600; color:#CBD5E1; margin-bottom:6px;">TEAM 1</label>
                    <select id="team1" style="width:100%; padding:12px; background:#17243A; border:1px solid #344762; border-radius:10px; color:white; font-size:14px;">
                        <option value="">Loading teams...</option>
                    </select>
                </div>
                <div>
                    <label style="display:block; font-size:13px; font-weight:600; color:#CBD5E1; margin-bottom:6px;">TEAM 2</label>
                    <select id="team2" style="width:100%; padding:12px; background:#17243A; border:1px solid #344762; border-radius:10px; color:white; font-size:14px;">
                        <option value="">Loading teams...</option>
                    </select>
                </div>
            </div>

            <div class="section-title">📍 Match Information</div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px;">
                <div>
                    <label style="display:block; font-size:13px; font-weight:600; color:#CBD5E1; margin-bottom:6px;">CITY</label>
                    <select id="city" style="width:100%; padding:12px; background:#17243A; border:1px solid #344762; border-radius:10px; color:white; font-size:14px;"></select>
                </div>
                <div>
                    <label style="display:block; font-size:13px; font-weight:600; color:#CBD5E1; margin-bottom:6px;">VENUE</label>
                    <select id="venue" style="width:100%; padding:12px; background:#17243A; border:1px solid #344762; border-radius:10px; color:white; font-size:14px;"></select>
                </div>
                <div>
                    <label style="display:block; font-size:13px; font-weight:600; color:#CBD5E1; margin-bottom:6px;">TOSS WINNER</label>
                    <select id="toss_winner" style="width:100%; padding:12px; background:#17243A; border:1px solid #344762; border-radius:10px; color:white; font-size:14px;">
                        <option value="">Select teams first</option>
                    </select>
                </div>
                <div>
                    <label style="display:block; font-size:13px; font-weight:600; color:#CBD5E1; margin-bottom:6px;">TOSS DECISION</label>
                    <select id="toss_decision" style="width:100%; padding:12px; background:#17243A; border:1px solid #344762; border-radius:10px; color:white; font-size:14px;">
                        <option value="bat">Bat</option>
                        <option value="field">Field</option>
                    </select>
                </div>
            </div>

            <div style="margin-bottom: 24px;">
                <label style="display:block; font-size:13px; font-weight:600; color:#CBD5E1; margin-bottom:6px;">MATCH YEAR</label>
                <input type="number" id="year" value="2026" min="2014" max="2035" style="width:100%; padding:12px; background:#17243A; border:1px solid #344762; border-radius:10px; color:white; font-size:14px;">
            </div>

            <button class="btn-primary" onclick="predictMatch()" id="predict-btn">
                ⚡ PREDICT MATCH WINNER
            </button>
        </div>

        <div id="result" style="margin-top: 32px;"></div>

    </main>

    <script src="/js/predict.js"></script>
</body>
</html>
